name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit + shipped-data tests (no database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not integration" -q

  integration:
    name: Full pipeline against MariaDB
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.4          # the version the project was developed on (XAMPP)
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      HOSPITAL_DB_URL: mysql+pymysql://root:@127.0.0.1:3306/hospital_db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Load schema
        run: mysql -h 127.0.0.1 -u root < data/hospital_db.sql
      - run: pytest -m integration -q
